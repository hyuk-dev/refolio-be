services:
  springboot-app:  # 서비스 이름 (컨테이너 역할 명시)
    image: ${DOCKER_USERNAME}/refolio-app:latest  # 사용할 도커 이미지. GitHub Actions에서 푸시한 최신 버전 사용
    container_name: refolio-app  # 실제 생성될 컨테이너의 이름 지정

    ports:
      - "8080:8080"  # 호스트의 8080 포트를 컨테이너의 8080 포트에 매핑 (외부에서 접속 가능)

    environment:  # 컨테이너에 전달할 환경변수 설정
      SPRING_JWT_SECRET: ${SPRING_JWT_SECRET}  # JWT 시크릿 키 (보안용)
      MYSQL_URL: ${MYSQL_URL}                  # DB 접속 URL
      MYSQL_USER: ${MYSQL_USER}                # DB 사용자명
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}        # DB 비밀번호
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul -Dfile.encoding=UTF-8"  # JVM 시간대/인코딩 설정
      SPRING_PROFILES_ACTIVE: prod  # Spring Boot의 프로파일을 prod(운영)로 설정

    networks:
      - refolio-network  # 동일한 네트워크에 연결된 다른 컨테이너들과 통신 가능

  mysql:
    image: mysql:8.4
    container_name: refolio-mysql
    restart: unless-stopped

    environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}  # MySQL 루트 사용자 비밀번호
        MYSQL_DATABASE: refolio_db              # 초기 생성될 데이터베이스 이름
        MYSQL_USER: ${MYSQL_USER}              # MySQL 사용자명
        MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        TZ: 'Asia/Seoul'

    volumes:
      - mysql-data:/var/lib/mysql  # MySQL 데이터를 호스트의 볼륨에 저장하여 데이터 유지

    networks:
      - refolio-network

networks:
  refolio-network:

volumes:
  mysql-data:  # MySQL 데이터를 저장할 볼륨